description: Years-based fixture; same model as gens.demes.yaml but with time_units=years.
time_units: years
generation_time: 25
demes:
  - name: A
    epochs:
      - end_time: 250000  # 10000 generations * 25 years/gen
        start_size: 1000
      - end_time: 0
        start_size: 10000
  - name: B
    ancestors: [A]
    start_time: 1000000  # 40000 gens * 25
    epochs:
      - end_time: 500000  # 20000 gens * 25
        start_size: 20000
      - end_time: 0
        start_size: 10000
  - name: C
    ancestors: [A]
    start_time: 1500000  # 60000 gens * 25
    epochs:
      - end_time: 0
        start_size: 10000
migrations:
  - demes: [A, B]
    rate: 2.5e-06
  - demes: [B, C]
    rate: 2.5e-06
  - demes: [A, C]
    rate: 2.5e-06
