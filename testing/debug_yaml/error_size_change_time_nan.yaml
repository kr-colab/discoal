# Times must be finite: a NaN time passed the ">= 0" check and broke the
# sorting of the events. Rejected with:
#   "Error parsing config: population_size_changes[0].time (nan) must be a finite number"

simulation:
  sample_size: 10
  num_replicates: 1
  num_sites: 1000
  seed: [1, 2]
genetics:
  mutation_rate: 0.1
  recombination_rate: 0.1
demography:
  deme_sample_size: [10]
  demographic_events:
    population_size_changes:
      - {time: nan, size: 0.5, population: 0}
