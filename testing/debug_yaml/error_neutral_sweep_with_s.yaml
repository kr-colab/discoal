# Fixes #66: sweep_mode=neutral combined with a non-zero
# selection_coefficient was silently accepted; the coefficient is
# meaningless in a neutral "sweep", so a non-zero value almost certainly
# signals a user mistake. Now rejected with:
#   "Error parsing config: selection_coefficient (500) must be 0 when sweep_mode is 'neutral'"

simulation:
  sample_size: 10
  num_replicates: 1
  num_sites: 1000
  seed: [1, 2]
genetics:
  mutation_rate: 0.1
  recombination_rate: 0.1
demography:
  deme_sample_size: [10]
  effective_population_size: 10000
selection:
  sweep_mode: neutral
  selection_coefficient: 500
  sweep_position: 0.5
  fixation_time_ago: 0.01
