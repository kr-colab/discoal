# PR #54 (#45): sweep_position must be in [0, 1]. Pre-fix
# `if (sweep_position >= 0)` would have happily accepted 1.5 (sweep at a
# position outside the simulated locus). Now rejected with:
#   "Error parsing config: sweep_position (1.5) must be in [0, 1]"

simulation:
  sample_size: 10
  num_replicates: 1
  num_sites: 1000
  seed: [1, 2]
genetics:
  mutation_rate: 0.1
  recombination_rate: 0.1
demography:
  deme_sample_size: [10]
  effective_population_size: 1000000
selection:
  sweep_mode: stochastic
  selection_coefficient: 100
  sweep_position: 1.5
  fixation_time_ago: 0.1
output:
  output_type: "snp_array"
