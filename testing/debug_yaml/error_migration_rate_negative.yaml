# Fixes #65: parse_demography_block validated the migration_matrix
# diagonal but not off-diagonal sign; a negative rate copied into
# migMatConst[][] ran to completion producing statistical nonsense.
# Now rejected with:
#   "Error parsing config: migration_matrix rate (row 0 column 1 = -1) must be >= 0"

simulation:
  sample_size: 10
  num_replicates: 1
  num_sites: 1000
  seed: [1, 2]
genetics:
  mutation_rate: 0.1
  recombination_rate: 0.1
demography:
  deme_sample_size: [5, 5]
  effective_population_size: 10000
  migration_matrix:
    - row: [0.0, -1.0]
    - row: [1.0, 0.0]
