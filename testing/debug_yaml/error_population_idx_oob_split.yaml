# Fixes #63: derived/ancestral in population_splits were not bounds-checked;
# out-of-range values ran to completion (exit 0) with degenerate output.
# Now rejected with:
#   "Error parsing config: population_splits[0].ancestral (7) must be in [0, 2)"

simulation:
  sample_size: 10
  num_replicates: 1
  num_sites: 1000
  seed: [1, 2]
genetics:
  mutation_rate: 0.1
  recombination_rate: 0.1
demography:
  deme_sample_size: [5, 5]
  effective_population_size: 10000
  demographic_events:
    population_splits:
      - {time: 0.1, derived: 0, ancestral: 7}
