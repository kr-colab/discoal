# A migration rate change from a population to itself. Should error out with:
#   "Error parsing config: migration_rate_changes[0] source and destination (1) must differ"

simulation:
  sample_size: 10
  num_replicates: 1
  num_sites: 1000
  seed: [1, 2]
genetics:
  mutation_rate: 0.1
  recombination_rate: 0.1
demography:
  deme_sample_size: [5, 5]
  effective_population_size: 1.0
  migration_matrix:
    - row: [0.0, 0.1]
    - row: [0.1, 0.0]
  demographic_events:
    migration_rate_changes:
      - time: 0.5
        rate: 0.1
        source: 1
        destination: 1
output:
  output_type: "haplotype"
