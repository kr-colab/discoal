# Fixes #68: negative size in population_size_changes was not checked at
# parse time; tskit later failed with the opaque TSK_ERR_BAD_NODE_TIME_ORDERING.
# Now rejected with:
#   "Error parsing config: population_size_changes[0].size (-0.5) must be > 0"

simulation:
  sample_size: 10
  num_replicates: 1
  num_sites: 1000
  seed: [1, 2]
genetics:
  mutation_rate: 0.1
  recombination_rate: 0.1
demography:
  deme_sample_size: [10]
  effective_population_size: 10000
  demographic_events:
    population_size_changes:
      - {time: 0.1, size: -0.5, population: 0}
