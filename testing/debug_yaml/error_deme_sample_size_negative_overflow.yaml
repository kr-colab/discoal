# Fixes #60: deme_sample_size entries were never bounds-checked; the only
# validation was sum == sample_size. INT_MAX paired with a matching
# negative value passed the sum check, then downstream allocation using
# the huge positive entry aborted in glibc's allocator. Now rejected with:
#   "Error parsing config: deme_sample_size[1] (-2147483637) must be >= 0"

simulation:
  sample_size: 10
  num_replicates: 1
  num_sites: 1000
  seed: [1, 2]
genetics:
  mutation_rate: 0.1
  recombination_rate: 0.1
demography:
  deme_sample_size: [2147483647, -2147483637]
  effective_population_size: 10000
