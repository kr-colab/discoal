# The hard sweep of hard_sweep_example.yaml, with a deterministic
# trajectory: the allele frequency follows the logistic curve, with no
# genetic drift.
# Equivalent to: discoal 20 2 50000 -t 20 -r 20 -wd 0.05 -a 200 -x 0.5 -d 2002 3002

simulation:
  sample_size: 20
  num_replicates: 2
  num_sites: 50000
  seed: [2002, 3002]

genetics:
  mutation_rate: 20.0
  recombination_rate: 20.0

selection:
  sweep_mode: "deterministic"
  selection_coefficient: 200
  sweep_position: 0.5
  fixation_time_ago: 0.05
