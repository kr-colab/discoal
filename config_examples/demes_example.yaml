# Simulate using an external demes file to specify the demographic model.
# The model is in the sibling demes_example.demes.yaml, which also shows how
# its times map to the command line below. The -em events stop migration
# to and from each deme when it merges away. The demes importer emits these
# rate changes itself; -ed alone stops only the migration between the two
# demes that merge.
# Equivalent to: discoal 20 10 50000 -t 20.0 -r 15.0 -p 3 10 5 5 -M 0.1 -en 0.25 0 0.1 -en 0.5 1 2.0 -ed 1.0 1 0 -ed 1.5 2 0 -em 1.0 0 1 0 -em 1.0 1 0 0 -em 1.0 1 2 0 -em 1.0 2 1 0 -em 1.5 0 2 0 -em 1.5 2 0 0 -d 31337 4242

simulation:
  sample_size: 20
  num_replicates: 10
  num_sites: 50000
  seed: [31337, 4242]

genetics:
  mutation_rate: 20.0
  recombination_rate: 15.0

demography:
  deme_sample_size: [10, 5, 5]
  demes_filename: "config_examples/demes_example.demes.yaml"
