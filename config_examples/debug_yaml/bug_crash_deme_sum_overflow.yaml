# BUG: deme_sample_size entries are never bounds-checked and the
# validation only compares `sum == sample_size`. With INT_MAX paired with a
# matching negative value the sum still equals sample_size, so the check
# passes; downstream allocations based on the individual (huge positive)
# entry then abort via glibc's allocator ("realloc(): invalid old size",
# exit 134).
#
# Observed: crash in allocator.
# Expected: reject any deme_sample_size[i] < 0 at parse time.

simulation:
  sample_size: 10
  num_replicates: 1
  num_sites: 1000
  seed: [1, 2]
genetics:
  mutation_rate: 0.1
  recombination_rate: 0.1
demography:
  deme_sample_size: [2147483647, -2147483637]
  effective_population_size: 10000
