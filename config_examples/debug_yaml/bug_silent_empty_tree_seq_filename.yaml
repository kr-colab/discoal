# BUG: an empty string is accepted as tree_sequence_filename. The parser's
# filename NULL check passes (it's not NULL, just length 0), and the
# downstream write fails at runtime printing "Error writing tree sequence:
# No such file or directory" but the process still exits with code 0.
#
# Observed: error printed, exit 0.
# Expected: reject "" at parse time, or propagate the write failure to a
# non-zero exit.

simulation:
  sample_size: 10
  num_replicates: 1
  num_sites: 1000
  seed: [1, 2]
genetics:
  mutation_rate: 0.1
  recombination_rate: 0.1
demography:
  deme_sample_size: [10]
  effective_population_size: 10000
output:
  output_type: tree_sequence
  tree_sequence_filename: ""
