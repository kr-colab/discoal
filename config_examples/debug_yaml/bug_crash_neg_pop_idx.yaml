# BUG: population index in population_size_changes is unbounded, and a
# negative value causes a heap double-free (SIGABRT, exit 134). The parser
# copies the user's population into events[].popID without checking that it
# is in [0, npops). See FIXME at configInterface_alt.c parse_demography_block.
#
# Observed: `double free or corruption (out)` at runtime, core dumped.
# Expected: up-front rejection with a message naming the offending field.

simulation:
  sample_size: 10
  num_replicates: 1
  num_sites: 1000
  seed: [1, 2]
genetics:
  mutation_rate: 0.1
  recombination_rate: 0.1
demography:
  deme_sample_size: [10]
  effective_population_size: 10000
  demographic_events:
    population_size_changes:
      - {time: 0.1, size: 0.5, population: -1}
