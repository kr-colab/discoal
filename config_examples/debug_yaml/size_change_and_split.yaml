# PR #48: population_size_changes + population_splits.
# Exercises event-type fix ('g' -> 'n'), *2.0 time scaling, and split-direction
# mapping (derived -> ancestral backward in time).
# Equivalent cmdline:
#   discoal 20 2 10000 -d 42 4242 -t 0.5 -r 0.1 -p 2 10 10 \
#     -en 0.5 0 0.1 -ed 1.0 1 0 -N 1

simulation:
  sample_size: 20
  num_replicates: 2
  num_sites: 10000
  seed: [42, 4242]
genetics:
  mutation_rate: 0.5
  recombination_rate: 0.1
demography:
  deme_sample_size: [10, 10]
  effective_population_size: 1.0
  demographic_events:
    population_size_changes:
      - time: 0.5
        size: 0.1
        population: 0
    population_splits:
      - time: 1.0
        ancestral: 0
        derived: 1
output:
  output_type: "snp_array"
