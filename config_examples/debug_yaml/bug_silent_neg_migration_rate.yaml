# BUG: parse_demography_block only validates the migration_matrix diagonal
# (rejects non-zero self-migration); it does not check off-diagonal rates
# for negativity. A negative rate is copied straight into migMatConst[][]
# and the simulator runs to completion producing statistically nonsensical
# output.
#
# Observed: exit 0 with normal-looking haplotype output.
# Expected: reject any negative entry in migration_matrix.

simulation:
  sample_size: 10
  num_replicates: 1
  num_sites: 1000
  seed: [1, 2]
genetics:
  mutation_rate: 0.1
  recombination_rate: 0.1
demography:
  deme_sample_size: [5, 5]
  effective_population_size: 10000
  migration_matrix:
    - row: [0.0, -1.0]
    - row: [1.0, 0.0]
