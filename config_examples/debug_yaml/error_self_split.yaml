# Fixes #64: population_splits with derived == ancestral was silently
# accepted. A split into itself is ill-defined. Now rejected with:
#   "Error parsing config: population_splits[0] derived (0) and ancestral (0) must be distinct"

simulation:
  sample_size: 10
  num_replicates: 1
  num_sites: 1000
  seed: [1, 2]
genetics:
  mutation_rate: 0.1
  recombination_rate: 0.1
demography:
  deme_sample_size: [5, 5]
  effective_population_size: 10000
  demographic_events:
    population_splits:
      - {time: 0.1, derived: 0, ancestral: 0}
