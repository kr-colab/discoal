# BUG: a partial sweep with initial_frequency > final_frequency is
# accepted by the parser (both are validated independently against [0, 1))
# but then kills the simulator mid-run with exit 154 (signal abort).
#
# Observed: process dies after loading config, no meaningful error.
# Expected: parse_selection_block should reject init >= final when both
# soft-sweep and partial-sweep modes are active.

simulation:
  sample_size: 10
  num_replicates: 1
  num_sites: 1000
  seed: [1, 2]
genetics:
  mutation_rate: 0.1
  recombination_rate: 0.1
demography:
  deme_sample_size: [10]
  effective_population_size: 10000
selection:
  sweep_mode: stochastic
  selection_coefficient: 100
  sweep_position: 0.5
  fixation_time_ago: 0.01
  initial_frequency: 0.9
  final_frequency: 0.1
