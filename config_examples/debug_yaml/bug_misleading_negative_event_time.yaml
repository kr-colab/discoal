# BUG: a negative time in a demographic event is not rejected at parse
# time; the simulator runs and tskit fails later with
# TSK_ERR_BAD_NODE_TIME_ORDERING. Exit 1 is correct but the error blames
# tskit instead of the YAML input.
#
# Observed: exit 1 with misleading tskit error.
# Expected: reject any event time < 0 (and probably time == 0 for size
# changes / splits) at parse time.

simulation:
  sample_size: 10
  num_replicates: 1
  num_sites: 1000
  seed: [1, 2]
genetics:
  mutation_rate: 0.1
  recombination_rate: 0.1
demography:
  deme_sample_size: [10]
  effective_population_size: 10000
  demographic_events:
    population_size_changes:
      - {time: -1.0, size: 0.5, population: 0}
