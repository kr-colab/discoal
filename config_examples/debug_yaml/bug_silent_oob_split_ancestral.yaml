# BUG: population_splits with ancestral >= npops (or derived >= npops, or
# either < 0) are silently accepted, producing exit 0 and degenerate
# output. No index validation is performed in parse_demography_block.
#
# Observed: exit 0 with segsites: 0.
# Expected: reject ancestral/derived outside [0, num_demes).

simulation:
  sample_size: 10
  num_replicates: 1
  num_sites: 1000
  seed: [1, 2]
genetics:
  mutation_rate: 0.1
  recombination_rate: 0.1
demography:
  deme_sample_size: [5, 5]
  effective_population_size: 10000
  demographic_events:
    population_splits:
      - {time: 0.1, derived: 0, ancestral: 7}
