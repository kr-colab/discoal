# BUG: sweep_mode=neutral combined with a non-zero selection_coefficient
# is silently accepted. The coefficient is ignored (there is no selection
# in a neutral "sweep"), which almost certainly indicates a configuration
# mistake the user would want flagged.
#
# Observed: exit 0, runs as a neutral sweep.
# Expected: reject (or at minimum warn) when sweep_mode == neutral and
# selection_coefficient > 0.

simulation:
  sample_size: 10
  num_replicates: 1
  num_sites: 1000
  seed: [1, 2]
genetics:
  mutation_rate: 0.1
  recombination_rate: 0.1
demography:
  deme_sample_size: [10]
  effective_population_size: 10000
selection:
  sweep_mode: neutral
  selection_coefficient: 500
  sweep_position: 0.5
  fixation_time_ago: 0.01
