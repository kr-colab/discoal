# 3-deme demographic model expressed in demes format. Same topology as
# the sibling demographic_example.yaml, at half the time depths:
#   - Ancestor A (present-day pop 0) with a bottleneck releasing at 10000 gens.
#   - B (present-day pop 1) splits from A at 40000 gens, larger ancestral size.
#   - C (present-day pop 2) splits from A at 60000 gens.
#   - Symmetric migration between coexisting demes at 4Nm = 0.1.
#
# Discoal's demes importer sets the reference N to the first present-day
# deme's size. In command-line units:
#     cli_time = demes_generations / (4 * Ne_ref)
#     cli_size = demes_size / Ne_ref
#     cli_migration = demes_rate * 4 * Ne_ref
# With Ne_ref = 10000 the bottleneck at 10000 gens becomes -en 0.25, the
# ancestral-size change at 20000 gens becomes -en 0.5, the split at
# 40000 gens becomes -ed 1.0, the split at 60000 gens becomes -ed 1.5,
# and migration rate 2.5e-6 becomes 4Nm = 0.1. See demes_example.yaml for
# the full equivalent command line.

time_units: generations

demes:
  - name: A
    description: Ancestor of B and C; present-day pop 0.
    epochs:
      - end_time: 10000
        start_size: 1000
      - end_time: 0
        start_size: 10000
  - name: B
    description: Splits from A at 40000 gens ago; present-day pop 1.
    ancestors: [A]
    start_time: 40000
    epochs:
      - end_time: 20000
        start_size: 20000
      - end_time: 0
        start_size: 10000
  - name: C
    description: Splits from A at 60000 gens ago; present-day pop 2.
    ancestors: [A]
    start_time: 60000
    epochs:
      - end_time: 0
        start_size: 10000

migrations:
  # All three demes coexist in [0, 40000] gens.
  - demes: [A, B, C]
    rate: 2.5e-6
    start_time: 40000
    end_time: 0
  # After B merges into A, only A and C coexist in [40000, 60000] gens.
  - demes: [A, C]
    rate: 2.5e-6
    start_time: 60000
    end_time: 40000
