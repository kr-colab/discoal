# Full discoal YAML configuration example: this will not run as it contains
# conflicting options, but serves as a list of possible key-value pairs.

simulation:
  sample_size: 20
  num_replicates: 2
  num_sites: 10000
  seed: [12345, 10102]

genetics:
  mutation_rate: 1.0e-1
  recombination_rate: 1.0e-1
  gene_conversion_rate: 1.0e-1
  gene_conversion_tract_length: 100
  crossover_ratio: 0.5

demography:
  deme_sample_size: [10, 5, 5]
  effective_population_size: 1.0
  migration_matrix:
    - row: [0.0, 1.0e-1, 1.0e-1]
    - row: [1.0e-1, 0.0, 1.0e-1]
    - row: [1.0e-1, 1.0e-1, 0.0]
  demographic_events:
    # times in units of 4N0 generations, sizes relative to N0
    population_size_changes:
      - time: 0.5
        size: 2.0
        population: 0
      - time: 0.75
        size: 0.1
        population: 1
    # rates are 4N0 m; lineages move from source to destination
    migration_rate_changes:
      - time: 0.5
        rate: 0.5
        source: 0
        destination: 1
      - time: 1.25
        rate: 0.0
        source: 0
        destination: 2
    # part of the population's deme_sample_size
    ancient_samples:
      - time: 0.1
        population: 1
        sample_size: 2
    population_splits:
      - time: 2.0
        ancestral: 0
        derived: 1
      - time: 3.0
        ancestral: 0
        derived: 2
  demes_filename: "/path/to/demes"

selection:
  sweep_mode: "stochastic"
  sweep_mode: "deterministic"
  sweep_mode: "neutral"
  selection_coefficient: 10.0
  sweep_position: 0.5
  fixation_time_ago: 1.0
  initial_frequency: 1.0e-1
  final_frequency: 0.9
  beneficial_mutation_rate: 1.0e-2
  recurrent_sweep_rate: 0.1

output:
  output_type: "haplotype"
  output_type: "tree_sequence"
  hide_partial_snp: true
  unsimplified_tree_sequence: false
  tree_sequence_filename: "new_example.trees"
