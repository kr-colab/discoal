# Simulate three populations with migration and population mergers.
# Equivalent to: TODO CLI

simulation:
  sample_size: 20
  num_replicates: 2
  num_sites: 10000
  seed: [12345, 10102]

genetics:
  mutation_rate: 1.0e-1
  recombination_rate: 1.0e-1

demography:
  deme_sample_size: [10, 5, 5]
  effective_population_size: 1.0
  migration_matrix:
    - row: [0.0, 1.0e-1, 1.0e-1]
    - row: [1.0e-1, 0.0, 1.0e-1]
    - row: [1.0e-1, 1.0e-1, 0.0]
  demographic_events:
    population_size_changes:
      - time: 1000
        size: 2000
        population: 0
      - time: 1500
        size: 100
        population: 1
    population_splits:
      - time: 2.0
        ancestral: 0
        derived: 1
      - time: 3.0
        ancestral: 0
        derived: 2
