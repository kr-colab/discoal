# A hard sweep: one new beneficial mutation, at the middle of the locus,
# that fixed 0.05 x 4N generations ago, with alpha = 2Ns = 200.
# Equivalent to: discoal 20 2 50000 -t 20 -r 20 -ws 0.05 -a 200 -x 0.5 -d 2001 3001

simulation:
  sample_size: 20
  num_replicates: 2
  num_sites: 50000
  seed: [2001, 3001]

genetics:
  mutation_rate: 20.0
  recombination_rate: 20.0

selection:
  sweep_mode: "stochastic"
  selection_coefficient: 200
  sweep_position: 0.5
  fixation_time_ago: 0.05
