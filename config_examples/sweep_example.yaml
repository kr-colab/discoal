# Simulates a soft selective sweep halfway along the contig that ended at
# frequency 0.9 some time ago.
# Equivalent to: TODO CLI

simulation:
  sample_size: 15
  num_replicates: 10
  num_sites: 50000
  seed: [42, 54321]

genetics:
  mutation_rate: 20.0
  recombination_rate: 15.0

selection:
  sweep_mode: "stochastic"
  selection_coefficient: 10.0
  sweep_position: 0.5
  fixation_time_ago: 1.0
  initial_frequency: 1.0e-1
  final_frequency: 0.9
