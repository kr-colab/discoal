# Simulates a single population with mutation and recombination.
# Equivalent to: discoal 10 2 10000 -t 0.1 -r 0.1 -d 12345 67890

simulation:
  sample_size: 10
  num_replicates: 2
  num_sites: 10000
  seed: [12345, 67890]  # Optional: for reproducibility

genetics:
  mutation_rate: 1.0e-1   # theta = 4Nu
  recombination_rate: 1.0e-1  # rho = 4Nr
