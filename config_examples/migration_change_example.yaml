# Two populations with no migration near the present. Going backward in
# time: at t=0.5 migration starts (0 -> 1 at 4N0 m = 0.2, 1 -> 0 at 0.4);
# at t=1.0 migration 0 -> 1 stops; at t=2.0 pop 1 merges into pop 0.
# A migration rate change sets the rate at which lineages in `source` move
# to `destination` backward in time, from `time` into the past, as -em.
# A YAML split also stops all migration into and out of the merged
# population; on the command line that takes the -em events after -ed.
# Equivalent to: discoal 20 2 10000 -t 1.0 -r 1.0 -p 2 10 10 -em 0.5 0 1 0.2 -em 0.5 1 0 0.4 -em 1.0 0 1 0 -ed 2.0 1 0 -em 2.0 0 1 0 -em 2.0 1 0 0 -d 12345 10102

simulation:
  sample_size: 20
  num_replicates: 2
  num_sites: 10000
  seed: [12345, 10102]

genetics:
  mutation_rate: 1.0
  recombination_rate: 1.0

demography:
  deme_sample_size: [10, 10]
  effective_population_size: 1.0
  demographic_events:
    migration_rate_changes:
      - time: 0.5
        rate: 0.2
        source: 0
        destination: 1
      - time: 0.5
        rate: 0.4
        source: 1
        destination: 0
      - time: 1.0
        rate: 0.0
        source: 0
        destination: 1
    population_splits:
      - time: 2.0
        ancestral: 0
        derived: 1
