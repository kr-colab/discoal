name: CI

on:
  push:
    branches: [master, demes]
  pull_request:
    branches: [master, demes]

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        compiler: [gcc, clang]
        
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up compiler
      run: |
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt-get update
          sudo apt-get install -y clang
          echo "CC=clang" >> $GITHUB_ENV
        else
          echo "CC=gcc" >> $GITHUB_ENV
        fi
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential make git
    
    - name: Download Unity test framework
      run: |
        if [ ! -d "extern/Unity" ]; then
          cd extern
          git clone https://github.com/ThrowTheSwitch/Unity.git
          cd ..
        fi
    
    - name: Build discoal
      run: |
        make clean
        make discoal
        # Verify the binary works
        ./build/discoal 10 1 100 -t 10 > /dev/null
    
    - name: Run unit tests
      run: |
        echo "=== Building and running unit tests ==="
        make run_tests
    
    - name: Run individual tests with details on failure
      if: failure()
      run: |
        echo "=== Re-running failed tests individually ==="
        for test in test_node test_event test_mutations test_node_operations test_ancestry_segment test_active_segment test_trajectory; do
          if [ -f "./build/$test" ]; then
            echo "Running $test..."
            ./build/$test || true
          fi
        done

  basic-functionality:
    runs-on: ubuntu-latest
    name: Basic Functionality Tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential make
    
    - name: Build discoal
      run: |
        make clean
        make discoal
    
    - name: Test basic coalescent
      run: |
        echo "=== Testing basic coalescent ==="
        ./build/discoal 10 5 1000 -t 10 > output.txt
        [ -s output.txt ] || exit 1
        grep -q "^//$" output.txt || exit 1
        echo "✓ Basic coalescent works"
    
    - name: Test with recombination
      run: |
        echo "=== Testing with recombination ==="
        ./build/discoal 10 5 1000 -t 10 -r 10 > output_recomb.txt
        [ -s output_recomb.txt ] || exit 1
        echo "✓ Recombination works"
    
    - name: Test tree sequence output
      run: |
        echo "=== Testing tree sequence output ==="
        ./build/discoal 10 1 1000 -t 10 -ts test.trees > /dev/null
        [ -f test.trees ] || exit 1
        echo "Tree sequence output works"

    - name: Run YAML parser regression suite
      run: |
        echo "=== Running YAML parser regression suite ==="
        bash testing/yaml_parser_suite.sh

    - name: Run YAML example suite
      run: bash testing/yaml_validation_suite.sh

    - name: Run preflight validation suite
      run: bash testing/preflight_validation_suite.sh

  units-convention:
    runs-on: ubuntu-latest
    name: Unit Conventions vs msprime

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential make
        pip install msprime demes numpy

    - name: Build discoal
      run: make discoal

    # Checks that times, growth rates, and migration rates follow the
    # documented units, by comparison with msprime.
    - name: Check unit conventions
      run: python testing/units_convention_check.py

    # Checks the selected SNP of partial sweeps: its position, the
    # binomial count of its carriers, -h, and one site per recurrent sweep.
    - name: Check partial sweep SNP
      run: python testing/sweep_snp_check.py

    # Checks -S: a file with -wd's trajectory gives -wd's genealogies, and
    # a file that starts below 1 gives a partial sweep.
    - name: Check sweep trajectory files
      run: python testing/trajectory_file_check.py

    - name: Check recurrent sweeps
      run: python testing/recurrent_sweep_check.py

  memory-check:
    runs-on: ubuntu-latest
    name: Memory Leak Check
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential make valgrind git
    
    - name: Download Unity test framework
      run: |
        if [ ! -d "extern/Unity" ]; then
          cd extern
          git clone https://github.com/ThrowTheSwitch/Unity.git
          cd ..
        fi

    - name: Build with debug symbols
      run: |
        make clean
        # Use lower optimization for better debugging
        sed -i 's/-O3/-O0 -g/g' Makefile
        sed -i 's/-O2/-O0 -g/g' Makefile
        # -march=native can emit AVX-512 instructions on the runner, which
        # valgrind cannot decode (it stops the program with SIGILL).
        sed -i 's/ -march=native//g' Makefile
        make discoal
    
    - name: Check for memory leaks in basic run
      run: |
        echo "=== Checking memory leaks in basic coalescent ==="
        # Memory errors and definite leaks make valgrind exit 1.
        valgrind --leak-check=full --errors-for-leak-kinds=definite --error-exitcode=1 \
          ./build/discoal 10 1 100 -t 10 > /dev/null
    
    - name: Check for memory leaks with recombination
      run: |
        echo "=== Checking memory leaks with recombination ==="
        valgrind --leak-check=full --errors-for-leak-kinds=definite --error-exitcode=1 \
          ./build/discoal 10 1 100 -t 10 -r 10 > /dev/null