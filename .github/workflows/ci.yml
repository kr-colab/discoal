name: CI

on:
  push:
    branches: [master, demes]
  pull_request:
    branches: [master, demes]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        compiler: [gcc, clang]
        
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up compiler
      run: |
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt-get update
          sudo apt-get install -y clang
          echo "CC=clang" >> $GITHUB_ENV
        else
          echo "CC=gcc" >> $GITHUB_ENV
        fi
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential make git
    
    - name: Download Unity test framework
      run: |
        if [ ! -d "extern/Unity" ]; then
          cd extern
          git clone https://github.com/ThrowTheSwitch/Unity.git
          cd ..
        fi
    
    - name: Build discoal
      run: |
        make clean
        make discoal
        # Verify the binary works
        ./build/discoal 10 1 100 -t 10 > /dev/null
    
    - name: Run unit tests
      run: |
        echo "=== Building and running unit tests ==="
        make run_tests
    
    - name: Run individual tests with details on failure
      if: failure()
      run: |
        echo "=== Re-running failed tests individually ==="
        for test in test_node test_event test_mutations test_node_operations test_ancestry_segment test_active_segment test_trajectory; do
          if [ -f "./build/$test" ]; then
            echo "Running $test..."
            ./build/$test || true
          fi
        done

  basic-functionality:
    runs-on: ubuntu-latest
    name: Basic Functionality Tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential make
    
    - name: Build discoal
      run: |
        make clean
        make discoal
    
    - name: Test basic coalescent
      run: |
        echo "=== Testing basic coalescent ==="
        ./build/discoal 10 5 1000 -t 10 > output.txt
        [ -s output.txt ] || exit 1
        grep -q "^//$" output.txt || exit 1
        echo "Basic coalescent works"
    
    - name: Test with recombination
      run: |
        echo "=== Testing with recombination ==="
        ./build/discoal 10 5 1000 -t 10 -r 10 > output_recomb.txt
        [ -s output_recomb.txt ] || exit 1
        echo "Recombination works"
    
    - name: Test tree sequence output
      run: |
        echo "=== Testing tree sequence output ==="
        ./build/discoal 10 1 1000 -t 10 -ts test.trees > /dev/null
        [ -f test.trees ] || exit 1
        echo "Tree sequence output works"

    - name: Run YAML parser regression suite
      run: |
        echo "=== Running YAML parser regression suite ==="
        bash testing/yaml_parser_suite.sh

    - name: Run YAML example suite
      run: bash testing/yaml_validation_suite.sh

    - name: Run preflight validation suite
      run: bash testing/preflight_validation_suite.sh

    - name: Run demes model suites
      run: |
        bash testing/demes_validation_suite.sh
        bash testing/demes_output_comparison_suite.sh

  units-convention:
    runs-on: ubuntu-latest
    name: Unit Conventions vs msprime

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential make
        pip install msprime demes numpy scipy

    - name: Build discoal
      run: make discoal

    # Checks that times, growth rates, and migration rates follow the
    # documented units, by comparison with msprime.
    - name: Check unit conventions
      run: python testing/units_convention_check.py

    # Checks the selected SNP of partial sweeps: its position, the
    # binomial count of its carriers, -h, and one site per recurrent sweep.
    - name: Check partial sweep SNP
      run: python testing/sweep_snp_check.py

    # Checks -S: a file with -wd's trajectory gives -wd's genealogies, and
    # a file that starts below 1 gives a partial sweep.
    - name: Check sweep trajectory files
      run: python testing/trajectory_file_check.py

    - name: Check recurrent sweeps
      run: python testing/recurrent_sweep_check.py

    # Hard sweeps (several strengths, and one that ended in the past)
    # against msprime's SweepGenicSelection.
    - name: Check hard sweeps against msprime
      run: python testing/sweep_msprime_check.py --workers 4

    # Gene conversion with tracts longer than the locus must match
    # crossover, in the neutral phase and in a sweep.
    - name: Check gene conversion against crossover
      run: python testing/gc_crossover_check.py --workers 4

    # Linkage of two sites (same MRCA, TMRCA correlation) against msprime:
    # a breakpoint anywhere in a lineage's span must split it.
    - name: Check two-site linkage against msprime
      run: python testing/linkage_msprime_check.py --workers 4

    # Random command-line demographic models (sizes, growth, migration,
    # admixture, merges, ancient samples, recombination) against msprime.
    # Fixed seeds, so the result does not change from run to run.
    - name: Fuzz test against msprime
      run: python testing/fuzz_msprime_check.py --models 150 --reps 500 --workers 4

  parity-subset:
    runs-on: ubuntu-latest
    name: Parity with msprime on demes models (core and random)
    timeout-minutes: 60
    env:
      # The demes specification commit whose examples and test cases are
      # drawn from; the same one as in the weekly full run.
      DEMES_SPEC_COMMIT: ea38d43
      # Models where earlier bugs showed: pulses, multi-ancestor
      # admixture, migration direction, migration under growth, extinct
      # demes, epoch boundaries, ancient samples.
      CORE_MODELS: >-
        HomSap/AmericanAdmixture_4B18,HomSap/AncientEurasia_9K19,PanTro/BonoboGhost_4K19,GorGor/GorillaGhost_5P23,CanFam/EarlyWolfAdmixture_6F14,HomSap/Zigzag_1S14,PonAbe/TwoSpecies_2L11,AnaPla/MallardBlackDuck_2L19,HomSap/OutOfAfricaArchaicAdmixture_5R19,examples/jacobs_papuans.yaml+ancient

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential make
        pip install stdpopsim msprime demes tskit numpy scipy

    - name: Build discoal
      run: make discoal

    - name: Get the demes specification
      run: |
        git clone -q https://github.com/popsim-consortium/demes-spec
        git -C demes-spec checkout -q "$DEMES_SPEC_COMMIT"

    # The core models always run. The random models change with each
    # commit, so that over many PRs every model is run; the seed comes
    # from the commit, so a failure can be repeated with the command
    # printed below.
    - name: Compare discoal with msprime
      run: |
        SHA="${{ github.event.pull_request.head.sha || github.sha }}"
        SEED=$((16#${SHA:0:8}))
        CMD="python testing/stdpopsim_parity.py --reps 500 --generic 20 --seed 1 --demes-dir demes-spec/examples --demes-dir demes-spec/test-cases/valid --models $CORE_MODELS --sample 80 --sample-seed $SEED --workers 4 --no-cache"
        echo "To repeat this run (demes-spec at $DEMES_SPEC_COMMIT; the draw depends on these package versions):"
        pip freeze | grep -iE '^(stdpopsim|msprime|demes|numpy|tskit)=='
        echo "$CMD"
        $CMD

  memory-check:
    runs-on: ubuntu-latest
    name: Memory Leak Check
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential make valgrind git
    
    - name: Download Unity test framework
      run: |
        if [ ! -d "extern/Unity" ]; then
          cd extern
          git clone https://github.com/ThrowTheSwitch/Unity.git
          cd ..
        fi

    - name: Build with debug symbols
      run: |
        make clean
        # Use lower optimization for better debugging
        sed -i 's/-O3/-O0 -g/g' Makefile
        sed -i 's/-O2/-O0 -g/g' Makefile
        # -march=native can emit AVX-512 instructions on the runner, which
        # valgrind cannot decode (it stops the program with SIGILL).
        sed -i 's/ -march=native//g' Makefile
        make discoal
    
    - name: Check for memory leaks in basic run
      run: |
        echo "=== Checking memory leaks in basic coalescent ==="
        # Memory errors and definite leaks make valgrind exit 1.
        valgrind --leak-check=full --errors-for-leak-kinds=definite --error-exitcode=1 \
          ./build/discoal 10 1 100 -t 10 > /dev/null
    
    - name: Check for memory leaks with recombination
      run: |
        echo "=== Checking memory leaks with recombination ==="
        valgrind --leak-check=full --errors-for-leak-kinds=definite --error-exitcode=1 \
          ./build/discoal 10 1 100 -t 10 -r 10 > /dev/null

    - name: Check memory errors in the segment pool
      run: |
        echo "=== Checking the segment pool through several expansions ==="
        make test_ancestry_segment
        valgrind --error-exitcode=1 ./build/test_ancestry_segment > /dev/null
